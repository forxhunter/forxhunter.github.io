name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes an in-flight deploy instead of racing it onto gh-pages.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The sitemap reads each file's last commit date from git history.
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      # Publishes to the gh-pages branch, which is what GitHub Pages already
      # serves for this repository, so no Pages setting has to change.
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # only check links within the site
          args: --offline --root-dir ${{ github.workspace }}/dist --no-progress 'dist/**/*.html'
